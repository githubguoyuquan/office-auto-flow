name: Build licensed Windows workbench
on:
  push:
    tags:
      - 'licensed-build-*'
  workflow_dispatch:
    inputs:
      public_keys_json:
        description: 'Paste public-keys.json from the issuer. Never provide a private key.'
        required: true
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Write public verification keys
        shell: pwsh
        env:
          PUBLIC_KEYS_JSON: ${{ inputs.public_keys_json }}
        run: |
          python -c "import os,pathlib,json; content=os.environ.get('PUBLIC_KEYS_JSON') or pathlib.Path('.github/license-public-keys.json').read_text(encoding='utf-8'); value=json.loads(content); pathlib.Path('public-keys.json').write_text(json.dumps(value),encoding='utf-8')"
      - name: Compile, smoke-test and build installer
        shell: powershell
        run: ./packaging/build_licensed_windows.ps1 -PublicKeys ./public-keys.json -BuildIssuer
      - name: Upload customer installer
        uses: actions/upload-artifact@v4
        with:
          name: AIOA-Customer-Installer
          path: |
            preview/Office-Auto-Flow-API-Licensed-*-win-x64.exe
            preview/Office-Auto-Flow-API-Licensed-*-win-x64.exe.sha256
          if-no-files-found: error
      - name: Upload owner-only issuer
        uses: actions/upload-artifact@v4
        with:
          name: AIOA-Owner-Issuer
          path: preview/AIOA-Issuer-*/
          if-no-files-found: error
